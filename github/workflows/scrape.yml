name: Update prices and deploy site

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "New Telegram link (optional, e.g. https://t.me/your_channel)"
        required: false
        default: ""
      add_urls:
        description: "Product links to add, separated by spaces (optional)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.json"
      - "watchlist.txt"
      - "scraper/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rasd-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Search stores, update prices, sort categories
        continue-on-error: true
        env:
          TELEGRAM_LINK: ${{ github.event.inputs.telegram_link }}
          ADD_URLS: ${{ github.event.inputs.add_urls }}
        run: node scraper/scrape.mjs

      - name: Save data to the repository
        run: |
          git config user.name "rasd-bot"
          git config user.email "rasd-bot@users.noreply.github.com"
          git add -A data config.json watchlist.txt
          if ! git diff --cached --quiet; then
            git commit -m "data: update $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Build site folder
        run: |
          mkdir _site
          cp index.html config.json _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
